# Gate Channel Automation (Experimental)
#
# Overview
#
# Some Navimow installations require the mower to pass through a narrow gate
# between mowing areas.
#
# If the gate is closed, the mower may stop in front of it, rotate, scan the
# environment with VisionFence/LiDAR, and lose time before continuing.
#
# This feature allows Home Assistant to detect when the mower enters a
# user-defined coordinate area, called a Channel, and automatically control
# the gate.
#
#
# How it works
#
# The Navimow integration can create one or more Channel binary sensors.
#
# Each channel is defined by a rectangular area using the mower local RTK
# coordinates:
#
# X min
# X max
# Y min
# Y max
#
# Whenever the mower enters that area, the channel binary sensor turns ON.
#
# Whenever the mower leaves that area, the channel binary sensor turns OFF.
#
# Example channel sensor:
#
# binary_sensor.tont_front_gate_channel
#
#
# Configuring a Channel
#
# Open Home Assistant:
#
# Settings
# Devices & Services
# Navimow
# Configure
#
# Select:
#
# - mower
# - channel name
#
# Enter:
#
# - X min
# - X max
# - Y min
# - Y max
#
# Example:
#
# Channel name:
# Front Gate
#
# X min:
# -34.713
#
# X max:
# -26.876
#
# Y min:
# 0.560
#
# Y max:
# 2.131
#
# After saving, Home Assistant automatically creates a channel binary sensor.
#
# Example:
#
# binary_sensor.tont_front_gate_channel
#
# No YAML editing is required for channel creation.
#
#
# Multiple mowers
#
# Each mower stores its own channels independently.
#
# Example:
#
# Tont
# - Front Gate
# - Backyard Gate
#
# Robot 2
# - Main Gate
# - Garage Gate
#
# Each mower receives its own channel binary sensors.
#
#
# Example Gate Automation
#
# This automation triggers when the mower enters the configured channel.
#
# Trigger:
#
# binary_sensor.tont_front_gate_channel turns ON
#
# The automation then:
#
# 1. remembers the mower state before pausing
# 2. pauses the mower
# 3. opens the gate
# 4. waits until the gate is open
# 5. waits an additional 5 seconds
# 6. resumes the correct mower action
#
#
# Resume Logic
#
# If the mower was mowing:
#
# Pause
# Open gate
# Wait for gate
# Wait 5 seconds
# Start mowing
#
# The mower continues its current mowing task.
#
# If the mower was docking:
#
# Pause
# Open gate
# Wait for gate
# Wait 5 seconds
# Dock
#
# The mower continues returning to the charging station.
#
#
# Why pause the mower?
#
# Opening a sliding gate typically takes several seconds.
#
# Without pausing, the mower may:
#
# - stop in front of the gate
# - rotate left and right
# - scan with VisionFence
# - wait unnecessarily
#
# Pausing before opening the gate provides a smoother transition.
#
#
# Coordinate Selection
#
# The easiest way to determine channel coordinates is:
#
# 1. Drive the mower manually to one corner.
# 2. Press Mow.
# 3. Read Position X and Position Y in Home Assistant.
# 4. Repeat for the opposite corner.
#
# Use exact coordinates that cover only the gate passage.
#
# Avoid including nearby mowing areas. Otherwise the automation may trigger
# while the mower is simply mowing close to the gate.
#
#
# Notes
#
# - This feature is based on the mower RTK coordinates.
# - Coordinates are local to each mower map.
# - Each mower can have multiple independent channels.
# - Channel sensors can be used for gates, doors, narrow passages, or custom
#   Home Assistant automations.
# - The feature does not require modifications to the Navimow map.
#
#
# Future Improvements
#
# Possible future additions:
#
# - Multiple channel editor
# - Polygon-based channels instead of rectangles
# - Native Channel Enter and Channel Exit events
# - Optional automatic gate handling directly inside the integration
# - Automatic stop/resume without requiring a Home Assistant automation
#
#
# ---------------------------------------------------------------------------
# Home Assistant Automation Example
# ---------------------------------------------------------------------------
#
# Replace these entity IDs if needed:
#
# binary_sensor.tont_front_gate_channel
# cover.gate_controller_gate
# lawn_mower.tont
# sensor.tont_vehicle_state
#
# The automation assumes:
#
# - cover.gate_controller_gate state becomes open when the gate is open enough
# - sensor.tont_vehicle_state reports mowing, docking, returning, paused, etc.
# - lawn_mower.pause works for the mower
# - lawn_mower.start_mowing resumes mowing tasks
# - lawn_mower.dock resumes return-to-dock tasks
#
# ---------------------------------------------------------------------------

id: '1783159427302'
alias: Navimow - gate interlock
mode: single

trigger:
  - platform: state
    entity_id: binary_sensor.tont_front_gate_channel
    to: 'on'

condition:
  - condition: template
    value_template: >
      {{ states('cover.gate_controller_gate') not in ['open', 'opening'] }}

action:
  - variables:
      mower_state: "{{ states('lawn_mower.tont') }}"
      vehicle_state_name: "{{ states('sensor.tont_vehicle_state') }}"

  - service: lawn_mower.pause
    target:
      entity_id: lawn_mower.tont

  - service: cover.open_cover
    target:
      entity_id: cover.gate_controller_gate

  - wait_template: >
      {{ is_state('cover.gate_controller_gate', 'open') }}

  - delay:
      seconds: 5

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ mower_state in ['returning', 'docked', 'docking']
                 or vehicle_state_name in ['returning', 'docked', 'docking'] }}
        sequence:
          - service: lawn_mower.dock
            target:
              entity_id: lawn_mower.tont
    default:
      - service: lawn_mower.start_mowing
        target:
          entity_id: lawn_mower.tont
